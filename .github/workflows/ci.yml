name: CI

# Typecheck, lint and unit-test the app. The suite covers the extracted state
# machines in src/hooks (workout clock, rest countdown, exercise cues) — pure
# hook tests with no device, no network and no native modules, so they gate
# every PR in under a second.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
